defaults:
  - _self_
  - task/policy: libero/libero_spatial_tinyplus

name: train_oatpolicy_tinyplus_cpu
_target_: oat.workspace.train_policy.TrainPolicyWorkspace

seed: 42
horizon: 32
n_action_steps: 16
n_obs_steps: 2
task_name: ${task.policy.name}
shape_meta: ${task.policy.shape_meta}

policy:
  _target_: oat.policy.oatpolicy.OATPolicy

  shape_meta: ${shape_meta}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}

  obs_encoder:
    _target_: oat.perception.fused_obs_encoder.FusedObservationEncoder
    _recursive_: false
    shape_meta: ${shape_meta}

    vision_encoder:
      _target_: oat.perception.robomimic_vision_encoder.RobomimicRgbEncoder
      crop_shape: [76, 76]

    state_encoder:
      _target_: oat.perception.state_encoder.ProjectionStateEncoder
      out_dim: null

  action_tokenizer:
    _target_: oat.tokenizer.oat.tokenizer.OATTok.from_checkpoint
    checkpoint: ???

  embed_dim: 128
  n_layers: 2
  n_heads: 2
  dropout: 0.1
  temperature: 1.0
  topk: 10
  use_adaptive_halting: false
  adaptive_halting:
    type: entropy
    entropy_threshold: 0.1
    train_entropy_threshold: 2.0
    # Lowered from 6.5 to 2.0. 6.5 caused K=1 mode collapse (stopped immediately
    # on certainty). 2.0 forces learning of longer prefixes for precision tasks.
    min_train_keep_k: 4
    # Require at least a 4-token prefix before the entropy oracle can emit STOP.
    # This keeps adaptive training from collapsing before the policy has learned
    # the higher-order tokens needed for precise LIBERO actions.
    use_dynamic_threshold: false
  halt_tolerance: 1.0e-3
  halt_keep_ks: [1, 2, 4, 8]

training:
  resume: false
  allow_bf16: false
  max_grad_norm: 1.0
  num_epochs: 50
  val_every: 5
  sample_every: 5
  rollout_every: 1000000
  checkpoint_every: 5
  lr_scheduler: constant
  lr_warmup_steps: 0
  gradient_accumulate_every: 1
  max_train_steps: 40
  max_val_steps: 10
  max_reconst_steps: 10
  seed: ${seed}
  use_ema: false
  num_demo: 2
  tqdm_interval_sec: 1.0

ema:
  _target_: oat.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

optimizer:
  policy_lr: 5.0e-5
  obs_enc_lr: 1.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.95]

dataloader:
  batch_size: 2
  num_workers: 0
  shuffle: true
  pin_memory: false
  persistent_workers: false
  drop_last: false

val_dataloader:
  batch_size: 2
  num_workers: 0
  shuffle: false
  pin_memory: false
  persistent_workers: false
  drop_last: false

logging:
  project: oat_cpu_tinyplus
  resume: false
  mode: offline
  name: ${now:%Y%m%d.%H%M%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "cpu", "tinyplus"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: val_loss
    mode: min
    k: 1
    format_str: 'ep-{epoch:04d}_loss-{val_loss:.3f}.ckpt'
  save_last_ckpt: true
  save_last_snapshot: false

multi_run:
  run_dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y%m%d.%H%M%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}
  sweep:
    dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
